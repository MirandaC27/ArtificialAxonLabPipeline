name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Java (required for pyimagej / imglyb / scyjava)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller
          --onefile
          --windowed
          --name "Pipeline"
          --paths=view
          --hidden-import=HomePage
          --hidden-import=Config
          --hidden-import=UploadPageStep1
          --hidden-import=SettingFront
          --hidden-import=masking_front
          --hidden-import=SessionEnd
          --hidden-import=history
          --hidden-import=results
          --hidden-import=tkinter
          --hidden-import=tkinter.ttk
          --hidden-import=PIL
          --hidden-import=PIL._tkinter_finder
          --hidden-import=cv2
          --hidden-import=numpy
          --hidden-import=pandas
          --hidden-import=scipy
          --hidden-import=xarray
          --hidden-import=tifffile
          --hidden-import=requests
          --hidden-import=jpype
          --hidden-import=scyjava
          --hidden-import=pyimagej
          --hidden-import=imglyb
          view/main_view.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pipeline-Windows-EXE
          path: dist/Pipeline.exe
          retention-days: 30